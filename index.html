<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <header class="topbar">
            <div class="topbar-container">
                <div class="topbar-brand">
                    <div class="topbar-logo">
                        <img src="assets/logo.png" alt="POS System Logo" class="topbar-logo-img">
                    </div>

                    <div class="topbar-brand-info">
                        <h1 class="topbar-logo-text">VanillaDesk</h1>
                        <span class="topbar-brand-subtitle">Point of Sale Management</span>
                    </div>
                </div>

                <nav class="topbar-nav" aria-label="Main navigation">
                    <a href="#billing" class="topbar-nav-link active" data-page="billing">
                        <span class="nav-link-text">Billing (POS)</span>
                    </a>

                    <a href="#products" class="topbar-nav-link" data-page="products">
                        <span class="nav-link-text">Products</span>
                    </a>

                    <a href="#sales" class="topbar-nav-link" data-page="sales">
                        <span class="nav-link-text">Sales</span>
                    </a>
                </nav>
            </div>
        </header>

        <main class="main-content">
            <div id="section-container" class="section-container" aria-live="polite">

            </div>
        </main>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
