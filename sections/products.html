<section class="section-content">
    <header class="section-header">
        <div class="section-header-text">
            <h1 class="section-title" id="products-title">Products</h1>
            <p class="section-subtitle">Manage your product catalog</p>
        </div>

        <div class="section-header-actions">
            <button type="button" class="btn btn-primary" id="add-product-btn">
                <span class="btn-icon" aria-hidden="true">+</span>
                <span class="btn-text">Add Product</span>
            </button>
        </div>
    </header>

    <div class="stat-cards" aria-label="Product statistics">
        <div class="stat-card-body">
            <p class="stat-card-label">Total Items</p>
            <p class="stat-card-value" id="stat-total">0</p>
        </div>

        <div class="stat-card-body">
            <p class="stat-card-label">Low Stock</p>
            <p class="stat-card-value" id="stat-low">0</p>
        </div>

        <div class="stat-card-body">
            <p class="stat-card-label">Out of Stock</p>
            <p class="stat-card-value" id="stat-out">0</p>
        </div>
    </div>

    <div class="table-wrapper">
        <table class="data-table" id="products-table">
            <thead class="data-table-head">
                <tr>
                    <th scope="col" class="col-id">ID</th>
                    <th scope="col" class="col-name">Name</th>
                    <th scope="col" class="col-qty">Quantity</th>
                    <th scope="col" class="col-reorder">Reorder Level</th>
                    <th scope="col" class="col-price">Price (LKR)</th>
                    <th scope="col" class="col-actions">Actions</th>
                </tr>
            </thead>

            <tbody class="data-table-body" id="products-tbody">

            </tbody>
        </table>
    </div>

    <div class="empty-state" id="products-empty" hidden>
        <p class="empty-state-title">No products yet</p>
        <p class="empty-state-text">Click “Add Product” to create item.</p>
    </div>

    <div class="modal-overlay" id="add-product-modal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="add-product-title">
            <header class="modal-header">
                <h2 class="modal-title" id="add-product-title">Add Product</h2>
                <button type="button" class="modal-close" id="add-product-close" aria-label="Close">×</button>
            </header>

            <form class="modal-body product-form" id="add-product-form" novalidate>
                <div class="form-field">
                    <label class="form-label" for="field-name">Product Name</label>
                    <input class="form-input" type="text" id="field-name" name="name" required>
                    <span class="form-error" id="error-name" aria-live="polite"></span>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label class="form-label" for="field-qty">Quantity</label>
                        <input class="form-input" type="number" id="field-qty" name="quantity" min="0" step="1" required>
                        <span class="form-error" id="error-qty" aria-live="polite"></span>
                    </div>

                    <div class="form-field">
                        <label class="form-label" for="field-price">Price per Item</label>
                        <input class="form-input" type="number" id="field-price" name="price" min="0" step="0.01" required>
                        <span class="form-error" id="error-price" aria-live="polite"></span>
                    </div>
                </div>

                <div class="form-field">
                    <label class="form-label" for="field-reorder">Reorder Level</label>
                    <input class="form-input" type="number" id="field-reorder" name="reorderLevel" min="0" step="1" required>
                    <span class="form-error" id="error-reorder" aria-live="polite"></span>
                </div>

                <footer class="modal-footer">
                    <button type="button" class="btn btn-ghost" id="add-product-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="add-product-submit">Save Product</button>
                </footer>
            </form>
        </div>
    </div>
</section>
